name: VentureFoundry Pilot Validation

on:
  pull_request:
    paths:
      - "venturefoundry-os/**"
      - ".github/workflows/venturefoundry-validate.yml"
  push:
    branches:
      - master
    paths:
      - "venturefoundry-os/**"
      - ".github/workflows/venturefoundry-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quiet repository checkout
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Run all integrity checks
        shell: bash
        run: |
          set -euo pipefail
          echo "=== VentureFoundry data and application validation ==="
          python3 venturefoundry-os/tools/validate_pilot.py
          echo "=== JavaScript syntax ==="
          node --check venturefoundry-os/app/app.js
          node --check venturefoundry-os/app/service-worker.js
          echo "=== JSON assets ==="
          python3 -m json.tool venturefoundry-os/app/data/pefy-gg-pilot.json > /dev/null
          python3 -m json.tool venturefoundry-os/app/manifest.webmanifest > /dev/null
          echo "All VentureFoundry checks passed."
